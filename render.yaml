services:
  - type: web
    name: presensi-rajasa-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: PresensiLabRajasa
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: DB_CONNECTION
        value: mysql
      - key: DB_PORT
        value: 4000
      - key: DB_DATABASE
        value: sistem_presensi_siswa_qr
      - key: DB_SSL
        value: true
      - key: PRESENSI_SESSION_TIMEOUT_MINUTES
        value: 20
      - key: PRESENSI_MAX_JAM_PER_SESI
        value: 3
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: 720
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,PUT,PATCH,DELETE,OPTIONS
      - key: CORS_ALLOWED_HEADERS
        value: Content-Type,Authorization,X-Requested-With
      # === ISI MANUAL DI RENDER DASHBOARD (jangan taruh di sini) ===
      # APP_URL         → https://nama-app-kamu.onrender.com
      # DB_HOST         → dari TiDB Cloud
      # DB_USERNAME     → dari TiDB Cloud
      # DB_PASSWORD     → dari TiDB Cloud
      # SESSION_SECRET  → string random panjang
      # CORS_ALLOWED_ORIGINS → https://nama-app-kamu.vercel.app
