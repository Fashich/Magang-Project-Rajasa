server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 10M;

    root /var/www/public;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Static server files (PDF kalender, dll)
    location /server/ {
        alias /var/www/server/;
        add_header Access-Control-Allow-Origin *;
    }

    # Semua request /api/ → PHP-FPM (localhost karena satu container)
    location ^~ /api/ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_read_timeout 300;
    }

    # Health check untuk UptimeRobot
    location = /api/health {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     /api/health;
        fastcgi_param REQUEST_METHOD  GET;
    }

    # Blok akses .php langsung
    location ~ \.php$ {
        return 404;
    }

    # Blok hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
